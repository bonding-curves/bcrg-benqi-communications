<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%" style="background:#F8FAFC; font-family:'Inter',system-ui,sans-serif;">
  <defs>
    <marker id="exec-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <filter id="exec-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1E293B">sAVAX Product Factory: 4 New Capital Acquisition Channels</text>

  <!-- Top Vault -->
  <g filter="url(#exec-shadow)">
    <rect x="190" y="38" width="380" height="52" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="380" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#1E40AF">BENQI sAVAX Staking Reserve Vault</text>
    <text x="380" y="78" text-anchor="middle" font-size="9.5" font-weight="600" fill="#2563EB">All capital inflows acquire &amp; lock sAVAX · Scales BENQI Liquid Staking TVL</text>
  </g>

  <!-- Connector from Vault to Label Pill -->
  <line x1="380" y1="90" x2="380" y2="104" stroke="#64748B" stroke-width="2"/>

  <!-- Label Pill (Cleanly centered, no line collisions) -->
  <rect x="285" y="104" width="190" height="22" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="380" y="119" text-anchor="middle" font-size="9.5" font-weight="600" fill="#475569">Tailored Risk / Return Profiles</text>

  <!-- Connector from Pill to Horizontal Distribution Bar -->
  <line x1="380" y1="126" x2="380" y2="142" stroke="#64748B" stroke-width="2"/>

  <!-- Horizontal Distribution Bar -->
  <line x1="105" y1="142" x2="655" y2="142" stroke="#64748B" stroke-width="2"/>

  <!-- 4 Clean Vertical Arrows to Cards -->
  <line x1="105" y1="142" x2="105" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#exec-arrow)"/>
  <line x1="290" y1="142" x2="290" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#exec-arrow)"/>
  <line x1="470" y1="142" x2="470" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#exec-arrow)"/>
  <line x1="655" y1="142" x2="655" y2="160" stroke="#64748B" stroke-width="2" marker-end="url(#exec-arrow)"/>

  <!-- Channel 1: Perp / Leverage Traders -->
  <g filter="url(#exec-shadow)">
    <rect x="20" y="165" width="170" height="135" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <rect x="28" y="173" width="154" height="20" rx="3" fill="#FEE2E2"/>
    <text x="105" y="187" text-anchor="middle" font-size="8" font-weight="700" fill="#991B1B">PERP &amp; LEVERAGE TRADERS</text>
    
    <text x="105" y="211" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">anAVAX</text>
    <text x="105" y="225" text-anchor="middle" font-size="8.5" font-weight="600" fill="#B91C1C">Junior Equity Tranche</text>
    <text x="105" y="243" text-anchor="middle" font-size="8" fill="#7F1D1D">• 2× Leveraged AVAX</text>
    <text x="105" y="256" text-anchor="middle" font-size="8" fill="#7F1D1D">• Zero Borrow Fees</text>
    <text x="105" y="269" text-anchor="middle" font-size="8" font-weight="600" fill="#991B1B">Zero Lending Pool Drain</text>
  </g>

  <!-- Channel 2: Institutional Fixed-Income -->
  <g filter="url(#exec-shadow)">
    <rect x="205" y="165" width="170" height="135" rx="6" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"/>
    <rect x="213" y="173" width="154" height="20" rx="3" fill="#DCFCE7"/>
    <text x="290" y="187" text-anchor="middle" font-size="8" font-weight="700" fill="#166534">INSTITUTIONAL FUNDS</text>

    <text x="290" y="211" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">anBOND</text>
    <text x="290" y="225" text-anchor="middle" font-size="8.5" font-weight="600" fill="#15803D">Senior Staking Bond</text>
    <text x="290" y="243" text-anchor="middle" font-size="8" fill="#14532D">• Base Staking Yield</text>
    <text x="290" y="256" text-anchor="middle" font-size="8" fill="#14532D">• Senior Secured Claim</text>
    <text x="290" y="269" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">Protected by Equity</text>
  </g>

  <!-- Channel 3: Ecosystem & L1s -->
  <g filter="url(#exec-shadow)">
    <rect x="390" y="165" width="160" height="135" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="398" y="173" width="144" height="20" rx="3" fill="#DBEAFE"/>
    <text x="470" y="187" text-anchor="middle" font-size="8" font-weight="700" fill="#1E40AF">DEFI, TREASURY &amp; L1s</text>

    <text x="470" y="211" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1E40AF">anUSD</text>
    <text x="470" y="225" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1D4ED8">Native Dollar Standard</text>
    <text x="470" y="243" text-anchor="middle" font-size="8" fill="#1E3A8A">• Ultra-Stable $1.00 Peg</text>
    <text x="470" y="256" text-anchor="middle" font-size="8" fill="#1E3A8A">• 3-Layer Protected</text>
    <text x="470" y="269" text-anchor="middle" font-size="8" font-weight="600" fill="#1E40AF">L1 Gas via Teleporter</text>
  </g>

  <!-- Channel 4: Yield Maximizers -->
  <g filter="url(#exec-shadow)">
    <rect x="565" y="165" width="175" height="135" rx="6" fill="#FAF5FF" stroke="#A855F7" stroke-width="1.5"/>
    <rect x="573" y="173" width="159" height="20" rx="3" fill="#F3E8FF"/>
    <text x="652" y="187" text-anchor="middle" font-size="8" font-weight="700" fill="#6B21A8">YIELD MAXIMIZERS</text>

    <text x="652" y="211" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B21A8">anYIELD</text>
    <text x="652" y="225" text-anchor="middle" font-size="8.5" font-weight="600" fill="#7E22CE">Enhanced Yield Tranche</text>
    <text x="652" y="243" text-anchor="middle" font-size="8" fill="#581C87">• Concentrated Rewards</text>
    <text x="652" y="256" text-anchor="middle" font-size="8" fill="#581C87">• Amplified Staking APY</text>
    <text x="652" y="269" text-anchor="middle" font-size="8" font-weight="600" fill="#6B21A8">Absorbs Reset Variance</text>
  </g>
</svg>